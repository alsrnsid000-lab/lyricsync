name: Build Windows

# 수동 실행하거나, v로 시작하는 태그를 밀면 돌아간다.
#   git tag v0.1.0 && git push --tags
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write        # 릴리스에 zip을 올리기 위해 필요

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90   # torch 설치와 PyInstaller 분석이 오래 걸린다

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"      # torch 휠이 가장 안정적으로 있는 버전
          cache: pip

      # --- 의존성 -----------------------------------------------------
      # torch는 CPU 전용 인덱스에서 받는다. 기본 인덱스는 CUDA 포함 휠을
      # 끌고 와서 2.5GB가 더 붙고, NVIDIA GPU가 없는 사람에겐 무용지물이다.
      - name: Install torch (CPU only)
        run: |
          python -m pip install --upgrade pip
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu

      - name: Install lyricsync dependencies
        run: |
          pip install faster-whisper demucs
          pip install pyinstaller==6.11.1

      - name: Show environment
        run: |
          python -c "import torch, sys; print('torch', torch.__version__, '| python', sys.version)"
          python -c "import demucs; print('demucs OK')"
          python -c "import faster_whisper; print('faster-whisper OK')"

      # --- ffmpeg 번들 ------------------------------------------------
      # 받는 사람 PC에 ffmpeg가 있다고 가정할 수 없으므로 같이 묶는다.
      - name: Fetch ffmpeg
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path packaging\ffmpeg | Out-Null
          $url = "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
          Write-Host "내려받기: $url"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip -UseBasicParsing
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-tmp -Force
          # 압축 안의 폴더 이름에 버전이 붙으므로 찾아서 꺼낸다
          Get-ChildItem ffmpeg-tmp -Recurse -Include ffmpeg.exe,ffprobe.exe |
            ForEach-Object { Copy-Item $_.FullName packaging\ffmpeg\ -Force }
          Get-ChildItem packaging\ffmpeg
          if (-not (Test-Path packaging\ffmpeg\ffmpeg.exe)) {
            throw "ffmpeg.exe를 찾지 못했습니다"
          }
          # 이후 단계에서도 쓸 수 있게 PATH에 올린다. 테스트가 합성 음원을
          # 만들 때 ffmpeg를 직접 부르는데, 러너에 기본 설치돼 있지 않다.
          "$PWD\packaging\ffmpeg" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      # --- 테스트 -----------------------------------------------------
      # 윈도우에서 돌려야 의미가 있다. 경로 구분자와 CP949 인코딩 문제가
      # 리눅스에서는 드러나지 않는다.
      - name: Run tests
        run: |
          python tests/test_align.py
          python tests/test_formats.py
          python tests/test_runtime.py
          python tests/test_cli.py
          python tests/test_gui.py
        env:
          PYTHONIOENCODING: utf-8

      # --- 빌드 -------------------------------------------------------
      - name: Build with PyInstaller
        run: pyinstaller packaging/lyricsync.spec --noconfirm --clean
        env:
          PYTHONIOENCODING: utf-8

      - name: Verify the build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (-not (Test-Path dist\lyricsync\lyricsync.exe)) {
            throw "lyricsync.exe가 만들어지지 않았습니다"
          }
          if (-not (Test-Path dist\lyricsync\_internal\ffmpeg\ffmpeg.exe)) {
            # PyInstaller 버전에 따라 _internal 없이 바로 들어가기도 한다
            if (-not (Test-Path dist\lyricsync\ffmpeg\ffmpeg.exe)) {
              throw "ffmpeg가 번들에 들어가지 않았습니다"
            }
          }
          $size = (Get-ChildItem dist\lyricsync -Recurse |
                   Measure-Object -Property Length -Sum).Sum / 1GB
          Write-Host ("번들 크기: {0:N2} GB" -f $size)
          # 파일이 있다는 것과 돌아간다는 것은 다르다. 다음 단계가 실제로 실행한다.

      # 빌드된 exe를 진짜로 실행해 본다. 파일 존재만 확인했을 때 "성공"으로
      # 넘어간 번들이 실행하자마자 ModuleNotFoundError로 죽은 적이 있다.
      # 정적 분석이 놓친 모듈은 실행해야만 드러난다.
      - name: Smoke test the exe
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = (Resolve-Path "dist\lyricsync\lyricsync.exe").Path
          $report = Join-Path $PWD "selftest-report.txt"

          Write-Host "실행: $exe --selftest"
          $proc = Start-Process -FilePath $exe -ArgumentList "--selftest", $report -PassThru
          if (-not $proc.WaitForExit(600000)) {
            $proc.Kill()
            throw "자가진단이 10분 안에 끝나지 않았습니다 (멈춤 추정)"
          }
          $code = $proc.ExitCode

          Write-Host "----- 자가진단 보고서 -----"
          if (Test-Path $report) {
            Get-Content $report -Encoding utf8 | ForEach-Object { Write-Host $_ }
          } else {
            Write-Host "(보고서 파일이 만들어지지 않았습니다 — 임포트 단계에서 죽었을 수 있습니다)"
          }
          Write-Host "---------------------------"

          if ($code -ne 0) {
            throw "자가진단 실패 (종료 코드 $code). 위 FAIL 항목을 스펙 hiddenimports에 추가하세요."
          }
          Write-Host "자가진단 통과 — 번들에 필요한 모듈이 전부 들어 있습니다."

      - name: Upload selftest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selftest-report
          path: selftest-report.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Add README for recipients
        shell: pwsh
        run: |
          Copy-Item README.md dist\lyricsync\README.md -Force
          @"
          lyricsync — 가사 싱크 자동 추출

          [실행 방법]
          이 폴더의 lyricsync.exe 를 더블클릭하세요.

          [중요]
          폴더 전체를 그대로 두고 쓰세요. lyricsync.exe 만 따로
          꺼내면 동작하지 않습니다 (ffmpeg와 라이브러리가 옆에 있어야 합니다).

          [처음 실행할 때]
          음성 인식 모델을 자동으로 내려받습니다 (1~3GB, 인터넷 필요).
          한 번 받으면 다음부터는 받지 않습니다.
          저장 위치: %LOCALAPPDATA%\lyricsync\models

          [문제가 생기면]
          %LOCALAPPDATA%\lyricsync\error.log 를 확인하세요.
          "@ | Out-File -FilePath dist\lyricsync\사용법.txt -Encoding utf8

      - name: Zip
        shell: pwsh
        run: |
          $name = "lyricsync-windows-x64"
          Compress-Archive -Path dist\lyricsync\* -DestinationPath "$name.zip"
          $mb = (Get-Item "$name.zip").Length / 1MB
          Write-Host ("zip 크기: {0:N0} MB" -f $mb)
          # GitHub 릴리스 파일당 한도는 2GB다. 넘으면 여기서 알려준다.
          if ($mb -gt 2000) {
            Write-Warning "2GB를 넘어 릴리스 업로드가 실패할 수 있습니다."
          }

      - uses: actions/upload-artifact@v4
        with:
          name: lyricsync-windows-x64
          path: lyricsync-windows-x64.zip
          retention-days: 30
          compression-level: 0      # 이미 zip이라 다시 압축해도 의미 없다

      # 태그를 밀었을 때만 릴리스를 만든다. 공유는 이 링크로 하면 된다.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: lyricsync-windows-x64.zip
          body: |
            ## 받는 분께

            `lyricsync-windows-x64.zip` 을 내려받아 **압축을 풀고**
            `lyricsync.exe` 를 더블클릭하세요.

            - 폴더 전체를 그대로 두고 쓰세요. exe만 꺼내면 동작하지 않습니다.
            - 처음 실행할 때 음성 인식 모델을 내려받습니다 (1~3GB, 인터넷 필요).
            - 윈도우 10/11 64비트. 설치 과정은 없습니다.
            - SmartScreen 경고가 뜨면 "추가 정보 → 실행"을 누르세요
              (코드 서명 인증서가 없어서 뜨는 경고입니다).
